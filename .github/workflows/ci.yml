name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck claude-export.sh tests/run.sh scripts/check-version.sh .githooks/pre-commit

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that every commit raises VERSION and updates CHANGELOG.md
        run: >-
          scripts/check-version.sh
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, bash 3.2
            os: macos-latest
            bash: /bin/bash
          - name: Linux, bash 5
            os: ubuntu-latest
            bash: bash
          - name: Linux, jq 1.6
            os: ubuntu-latest
            bash: bash
            jq: "1.6"
    steps:
      - uses: actions/checkout@v4
      - name: Install jq ${{ matrix.jq }}
        if: matrix.jq
        run: |
          mkdir -p "$HOME/jq"
          curl -fsSL -o "$HOME/jq/jq" "https://github.com/jqlang/jq/releases/download/jq-${{ matrix.jq }}/jq-linux64"
          chmod +x "$HOME/jq/jq"
          echo "$HOME/jq" >> "$GITHUB_PATH"
      - run: jq --version && ${{ matrix.bash }} --version | head -1
      - run: ${{ matrix.bash }} tests/run.sh
